{% extends "base.html" %}
{% load static %}

{% block title %}
    Adicione Tarefas
{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/adicionar.css' %}">
{% endblock %}

{% block page_title %}
    Adicione Sua Tarefa
{% endblock %}

{% block content %}
    <main class="main">
        <form method="post" class="form">

            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="button-submit">Enviar</button>

            <a href="{% url 'listar' %}" class="button-voltar">Voltar</a>
        </form>
    </main>
{% endblock %}
