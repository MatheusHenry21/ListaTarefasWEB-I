<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deletar</title>
</head>
<body>
    <h1>Excluir Tarefa</h1>

    <p>Tem certeza que deseja excluir essa tarefa?</p>
    <p>{{ tarefa }}</p>

    <form method="post">
        {% csrf_token %}

        <button type="submit">Sim, excluir!</button>
    </form>

    <a href="{% url 'listar' %}">Voltar</a>
</body>
</html>
